services:
  - type: web
    name: olivarez-ccs-201system
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ALLOWED_DOMAIN
        value: olivarezcollege.edu.ph
      - key: SESSION_TIMEOUT_MINUTES
        value: 30
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: true
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_URL
        sync: false
